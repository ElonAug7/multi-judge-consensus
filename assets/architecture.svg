<text x="945" y="448" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#86868b" text-anchor="middle">fully logged</text><path d="M 1110 435 L 1142 435" stroke="#86868b" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#86868b"/></marker></defs><text x="40" y="542" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#86868b">MJC pipeline — deterministic checks first, escalation is monotonic (never downgrades precision)</text></svg>