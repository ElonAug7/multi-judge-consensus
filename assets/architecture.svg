<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" width="1500" height="560"><rect x="40" y="60" width="330" height="210" rx="20" fill="#e8f2ff" stroke="#0a84ff" stroke-opacity="0.35" stroke-width="2"/>
